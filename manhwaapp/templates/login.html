<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.84.0">
    <title>Signin Template · Bootstrap v5.0</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='signin.css') }}">

    <style>
      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }
    </style>

    
    <!-- Custom styles for this template -->
    <link href="signin.css" rel="stylesheet">
  </head>
  <body class="text-center">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
    
<main class="form-signin">
  {% if form.errors %}
  <div class="alert alert-danger text-start py-2 px-3 mb-3" style="font-size: 0.85rem; border-radius: 8px;">
    <ul class="mb-0 ps-3">
      {% for field, errors in form.errors.items() %}
        {% for error in errors %}
          <li>{{ error }}</li>
        {% endfor %}
      {% endfor %}
    </ul>
  </div>
{% endif %}
  <form method="POST">
    {{ form.hidden_tag() }}
    <img class="mb-5" src="{{url_for('static', filename='images/logo.png')}}" alt="Logo" width="235" height="100">
    <h1 class="h4 mb-2 fw-normal">Log In </h1>

    <div class="form-floating mb-2">
        <input type="username" class="form-control" id="username" name="username" placeholder="name123">
        <label form="username">Username</label>
    </div>
    <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" name="password" placeholder="password">
        <label for="password">Password</label>
    </div>

    <div class="form-check-label mb-3">
      <label>
        <input type="checkbox" value="remember-me"> Remember me
      </label>
    </div>
    <button class="w-100 btn btn-lg btn-primary" type="submit">Log In</button>
    <p class="mt-5 mb-3 text-muted">&copy; 2017–2021</p>
  </form>
  <div class="form-check-label">
    <p>Dont Have An Account? <a href="{{url_for('register')}}">Sign Up</a></p>
</div>
</main>


    
  </body>
</html>
